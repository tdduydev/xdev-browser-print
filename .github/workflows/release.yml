name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    name: Build, test & GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag must match the extension version
        run: |
          version=$(node -p "require('./apps/extension/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match apps/extension version v$version" >&2
            exit 1
          fi
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm build
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: extension-zip
          path: release/
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.zip release/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  chrome-web-store:
    name: Upload to Chrome Web Store
    needs: [release]
    runs-on: ubuntu-latest
    # Protected environment: add required reviewers in repo settings so a human approves each upload.
    environment: chrome-web-store
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: extension-zip
          path: release/
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Upload and submit for review
        env:
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
        run: node scripts/publish-cws.mjs release/xdev-browser-print-${GITHUB_REF_NAME#v}.zip
