name: Release Please

# Every push to main with releasable commits (feat/fix/…) cuts a release on its own: release-please
# opens the Release PR (version bump + CHANGELOG), this job merges it, then tags vX.Y.Z and runs the
# release workflow. npm and Chrome Web Store still wait for a reviewer in their GitHub environments.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Only this job is serialised: the release job can wait hours for a deployment approval and must not
    # hold up the next push.
    concurrency:
      group: release-please
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created || steps.rp_after_merge.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name || steps.rp_after_merge.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Merge the Release PR
        if: steps.rp.outputs.pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ fromJSON(steps.rp.outputs.pr).number }}
        run: |
          # GitHub computes mergeability asynchronously right after the PR is opened or updated.
          for _ in 1 2 3 4 5 6; do
            if gh pr merge "$PR" --repo "$GITHUB_REPOSITORY" --merge; then exit 0; fi
            sleep 10
          done
          exit 1
      # A push made with GITHUB_TOKEN does not trigger workflows, so tag and release in this same run.
      - id: rp_after_merge
        if: steps.rp.outputs.pr
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          skip-github-pull-request: true

  release:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # A called workflow can only use the permissions granted here.
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
